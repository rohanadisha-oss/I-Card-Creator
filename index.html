<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Professional ATM Student Card</title>

<style>

/* ================= PAGE SETUP ================= */
@page{
  size:A4;
  margin:12mm;
}

body{
  margin:0;
  font-family:Segoe UI, Arial, sans-serif;
  background:#ffffff;
}

/* ================= CONTROL PANEL ================= */
.controls{
  padding:20px;
  background:#f3f3f3;
  text-align:center;
}

textarea{
  width:90%;
  height:120px;
  padding:10px;
  margin-bottom:15px;
}

button{
  padding:10px 20px;
  margin:10px;
  cursor:pointer;
}

/* ================= GRID (8 PER PAGE) ================= */
.page{
  width:186mm;
  height:262mm;
  margin:12mm auto;

  display:grid;
  grid-template-columns:repeat(2, 85.6mm);
  grid-template-rows:repeat(4, 54mm);  /* 🔵 4 rows */
  column-gap:14.8mm;
  row-gap:8mm;  /* slight adjust */

  justify-content:center;
  align-content:center;

  page-break-after:always;
}

/* ================= CARD ================= */
.card{
  width:85.6mm;
  height:54mm;
  border-radius:6mm;
  overflow:hidden;
  position:relative;
  background:#ffffff;
  border:1px solid #cbd5e1;
  box-shadow:0 4px 8px rgba(0,0,0,0.15);
  display:flex;
  flex-direction:column;
}

/* ================= HEADER ================= */
.header{
  background:linear-gradient(180deg,#1d4ed8,#1e40af);
  color:white;
  text-align:center;
  padding:3mm 0 2mm 0;
}

.school{
  font-size:10px;
  font-weight:700;
  letter-spacing:1px;
}

.title{
  margin-top:1mm;
  background:#1e3a8a;
  display:inline-block;
  padding:1mm 4mm;
  border-radius:3mm;
  font-size:8px;
  font-weight:600;
}

/* ================= BODY ================= */
.body{
  flex:1;
  padding:3mm;
  position:relative;
  display:flex;
  justify-content:space-between;
  overflow:hidden;
}

/* ================= WATERMARK ================= */
.body::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("https://i.supaimg.com/835b8e92-9f71-4e29-92f3-f4890a45e2af/bf90fdd5-ad01-4e29-8e10-1bfe55a01d70.png") center/60% no-repeat;
  opacity:0.06;
  z-index:0;
}

.left, .right{
  position:relative;
  z-index:1;
}

/* ================= LEFT SECTION ================= */
.left{
  width:28mm;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.photo{
  width:22mm;
  height:26mm;
  border:1px solid #1e3a8a;
  overflow:hidden;
  background:#f1f5f9;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.info{
  margin-top:2mm;
  font-size:7px;
  text-align:center;
  color:#0f172a;
}

/* ================= RIGHT SECTION ================= */
.right{
  width:25mm;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
}

.qr{
  width:22mm;
  height:22mm;
}

.signature{
  text-align:center;
  font-size:6px;
  color:#0f172a;
}

.signature img{
  height:6mm;
  max-width:22mm;
  display:block;
  margin:auto;
}

.sign-line{
  border-top:1px solid #000;
  margin-top:1mm;
}

/* ================= PRINT ================= */
@media print{
  .controls{ display:none; }
  .card{
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
}

</style>
</head>

<body>

<div class="controls">

<h3>Student List</h3>
<p>Format: 1, Jubair Ahomed,Roll-1</p>
<textarea id="studentData">
1, Jubair Ahomed,Roll-1
2, Rahim Uddin,Roll-2
3, Karim Ali,Roll-3
4, Sabina Khatun,Roll-4
5, Anika Islam,Roll-5
6, Hasan Ali,Roll-6
7, Mehedi Hasan,Roll-7
8, Farhana Akter,Roll-8
</textarea>

<h3>Roll Wise Photo Link (Optional)</h3>
<p>Format: Roll-1 = https://photo-link.jpg</p>
<textarea id="photoData"></textarea>

<button onclick="generateCards()">Generate Cards</button>
<button onclick="window.print()">Print</button>

</div>

<div id="output"></div>

<script>

const defaultPhoto = "https://i.supaimg.com/835b8e92-9f71-4e29-92f3-f4890a45e2af/b7e5aaab-4af3-4189-ae93-72269ba6e908.png";
const signatureLink = "https://i.supaimg.com/835b8e92-9f71-4e29-92f3-f4890a45e2af/981ffe00-efbb-4d44-8d73-58cc84e85716.png";

function generateCards(){

const studentLines = document.getElementById("studentData").value.trim().split("\n");
const photoLines = document.getElementById("photoData").value.trim().split("\n");

const output = document.getElementById("output");
output.innerHTML="";

let photoMap = {};

photoLines.forEach(line=>{
  const parts = line.split("=");
  if(parts.length==2){
    const roll = parts[0].trim().replace(/Roll-?/i,"");
    const link = parts[1].trim();
    photoMap[roll] = link;
  }
});

let page;

studentLines.forEach((line,index)=>{

if(index % 8 === 0){   /* 🔵 8 cards per page */
  page = document.createElement("div");
  page.className="page";
  output.appendChild(page);
}

const parts = line.split(",");
if(parts.length<3) return;

const serial = parts[0].trim();
const name = parts[1].trim();
const roll = parts[2].replace(/Roll-?/i,"").trim();

const photoLink = photoMap[roll] ? photoMap[roll] : defaultPhoto;

const card = document.createElement("div");
card.className="card";

card.innerHTML = `
<div class="header">
<div class="school">FAHM ACADEMY</div>
<div class="title">STUDENT CARD</div>
</div>

<div class="body">

<div class="left">
<div class="photo">
<img src="${photoLink}">
</div>
<div class="info">
${name}<br>
Roll No: ${roll}
</div>
</div>

<div class="right">
<img class="qr"
src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${serial},${name},Roll-${roll}">
<div class="signature">
${signatureLink ? `<img src="${signatureLink}">` : ""}
<div class="sign-line"></div>
Authorized Signature
</div>
</div>

</div>
`;

page.appendChild(card);

});

}

generateCards();

</script>

</body>
</html>
